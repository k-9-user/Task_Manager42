limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server_tokens off;

server {
    listen 8080 default_server;
    listen 8443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    return 444;
}

server {
    listen 8080;
    server_name localhost 127.0.0.1;

    return 308 https://localhost:8443$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name localhost 127.0.0.1;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    client_max_body_size 10m;
    limit_req_status 429;
    error_page 429 = @rate_limited;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 6 always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        return 429 '{"success":false,"error":"Too many requests"}';
    }

    location = /api/auth/register {
        limit_req zone=auth_per_ip burst=5 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy.conf;
    }

    location = /api/auth/login {
        limit_req zone=auth_per_ip burst=5 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy.conf;
    }

    location = /api/auth/oauth/google {
        limit_req zone=auth_per_ip burst=5 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy.conf;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy.conf;
    }

    location = /health {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy.conf;
    }

    location = /docs {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy.conf;
    }

    location = /redoc {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy.conf;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy.conf;
    }

    location / {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $frontend_upstream http://frontend:5173;
        proxy_pass $frontend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        include /etc/nginx/proxy.conf;
    }
}
